# nom du pool PHP-FPM
[www]

user = www-data
group = www-data

# PHP-FPM écoute sur le port 9000
listen = 9000

listen.owner = www-data
listen.group = www-data

#gere le nb de workers PHP-FPM lances /gardes dispo
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

# permet aux variables d'env d’etre visibles cote PHP-FPM
clear_env = no

# redirige les sorties des workers
catch_workers_output = yes

#limite l'exec aux fichiers .php (securite)
security.limit_extensions = .php